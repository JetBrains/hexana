version: "1.0"

checks:
  - configurationId: "InnoHub_HexFlow_SafeMergeTests"
    executeOnChanges:
      - "*"
      - "!/README.md"
  - configurationId: "InnoHub_HexFlow_UiTestsPatronus"
    executeOnChanges:
      - "/ui-driver-tests/**"
      - "/idea-plugin/src/ui-tests-framework/**"
  - configurationId: "InnoHub_HexFlow_IntellijPluginTestsPatronus"
    group:
      id: "hexana-product-tests"
    executeOnChanges:
      - "/idea-plugin/**"
  - configurationId: "InnoHub_HexFlow_CoreTestsPatronus"
    group:
      id: "hexana-product-tests"
      isFallback: true
    executeOnChanges:
      - "/build.gradle.kts"
      - "/settings.gradle.kts"
      - "/gradle.properties"
      - "/gradle/**"
      - "/gradlew"
      - "/gradlew.bat"
      - "/karma.config.d/**"
      - "/analytics/**"
      - "/binaryProvider/**"
      - "/debugInfo/**"
      - "/disassembly/**"
      - "/encdec/**"
      - "/hexanaDocument/**"
      - "/jvm-jit/**"
      - "/parsing/**"
      - "/plugins-shared/**"
      - "/wasmParser/**"
      - "/graalwasm/**"
      - "/wasm-modules/**"
      - "/kotlin-js-store/**"
      - "/mcp/core/**"
      - "/mcp/scripting/**"
      - "/mcp/tools-generator/**"
  - configurationId: "InnoHub_HexFlow_VscodePluginTestsPatronus"
    group:
      id: "hexana-product-tests"
    executeOnChanges:
      - "/vscode-plugin/**"
      - "/web-ui/**"
  - configurationId: "InnoHub_HexFlow_ServerCliTestsPatronus"
    group:
      id: "hexana-product-tests"
    executeOnChanges:
      - "/cli/**"
      - "/mcp/**"
      - "!/mcp/core/**"
      - "!/mcp/scripting/**"
      - "!/mcp/tools-generator/**"
