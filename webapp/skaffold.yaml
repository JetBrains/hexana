apiVersion: skaffold/v4beta8
kind: Config
metadata:
  name: hexana-webapp
build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: registry.jetbrains.team/p/hx/containers/hexana-webapp
      context: ..
      docker:
        dockerfile: webapp/Dockerfile
        buildArgs:
          HEXANA_SOURCE_REVISION: "{{.HEXANA_SOURCE_REVISION}}"
          HEXANA_WEBAPP_RELEASE_BRANCH: "{{.HEXANA_WEBAPP_RELEASE_BRANCH}}"
          HEXANA_SOURCE_URL: "https://github.com/JetBrains/hexana"
  local:
    useDockerCLI: false
    useBuildkit: true
deploy:
  helm:
    releases:
      - name: hexana-webapp
        remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
        version: 0.2.1
        upgradeOnChange: true
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED}}"
          imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
          applicationName: "{{.APPLICATION_NAME}}"
profiles:
  - name: staging
    deploy:
      helm:
        releases:
          - name: hexana-webapp
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_staging.yaml]
            setValueTemplates:
              image: "{{.IMAGE_FULLY_QUALIFIED}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
  - name: production
    deploy:
      helm:
        releases:
          - name: hexana-webapp
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_production.yaml]
            setValueTemplates:
              image: "{{.IMAGE_FULLY_QUALIFIED}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
