apiVersion: skaffold/v4beta8
kind: Config
metadata:
  name: hexana-webapp
build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: registry.jetbrains.team/p/hx/containers/hexana-webapp
      context: ..
      docker:
        dockerfile: webapp/Dockerfile
        buildArgs:
          HEXANA_SOURCE_REVISION: "{{.HEXANA_SOURCE_REVISION}}"
          HEXANA_WEBAPP_RELEASE_BRANCH: "{{.HEXANA_WEBAPP_RELEASE_BRANCH}}"
          HEXANA_SOURCE_URL: "https://github.com/JetBrains/hexana"
  local:
    useDockerCLI: false
    useBuildkit: true
deploy:
  helm:
    releases:
      - name: hexana-webapp
        remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
        version: 0.2.1
        upgradeOnChange: true
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED}}"
          imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
          applicationName: "{{.APPLICATION_NAME}}"
profiles:
  - name: staging
    patches:
      - op: replace
        path: /build/tagPolicy
        value:
          gitCommit:
            variant: CommitSha
      - op: replace
        path: /build/artifacts/0/docker/buildArgs/HEXANA_SOURCE_REVISION
        value: "{{.IMAGE_TAG}}"
      - op: remove
        path: /build/artifacts/0/docker/buildArgs/HEXANA_WEBAPP_RELEASE_BRANCH
      - op: add
        path: /build/artifacts/0/hooks
        value:
          before:
            - command: ["sh", "-ec", "source_root=\"$(git rev-parse --show-toplevel)\"; revision=\"$(git -C \"${source_root}\" rev-parse --verify HEAD^{commit})\"; printf '%s\\n' \"${revision}\" | grep -Eq '^[0-9a-f]{40}$'; exec docker run --rm --user \"$(id -u):$(id -g)\" --mount \"type=bind,src=${source_root},dst=/workspace\" --workdir /workspace --env \"HEXANA_SOURCE_REVISION=${revision}\" --env \"GRADLE_USER_HOME=/tmp/hexana-webapp-staging-gradle\" registry.jetbrains.team/p/hx/containers/hexana-webapp-build-environment@sha256:c9637fa0bb073a5009cba86bba38b564756ded1e75157251f76216292d68582c node webapp/stage-cloud-console-staging-package.mjs"]
      - op: add
        path: /build/artifacts/0/docker/buildArgs/HEXANA_WEBAPP_PACKAGE_MODE
        value: staging
    deploy:
      helm:
        releases:
          - name: hexana-webapp
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_staging.yaml]
            setValueTemplates:
              image: "{{.IMAGE_FULLY_QUALIFIED}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
  - name: production
    deploy:
      helm:
        releases:
          - name: hexana-webapp
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_production.yaml]
            setValueTemplates:
              image: "{{.IMAGE_FULLY_QUALIFIED}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
  - name: deploy_only_master
    patches:
      - op: remove
        path: /build
    deploy:
      helm:
        releases:
          - name: "{{.APPLICATION_NAME}}"
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_staging.yaml]
            setValueTemplates:
              image: "{{.HEXANA_WEBAPP_IMAGE}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
  - name: deploy_only_production
    patches:
      - op: remove
        path: /build
    deploy:
      helm:
        releases:
          - name: "{{.APPLICATION_NAME}}"
            remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app
            version: 0.2.1
            upgradeOnChange: true
            valuesFiles: [values_production.yaml]
            setValueTemplates:
              image: "{{.HEXANA_WEBAPP_IMAGE}}"
              imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
              applicationName: "{{.APPLICATION_NAME}}"
