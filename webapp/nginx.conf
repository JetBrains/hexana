server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { include /etc/nginx/snippets/security-headers.conf; limit_except GET HEAD { deny all; } access_log off; default_type text/plain; add_header Cache-Control "no-store" always; return 204; }
    location = /index.html { include /etc/nginx/snippets/security-headers.conf; limit_except GET HEAD { deny all; } add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location /assets/ { include /etc/nginx/snippets/security-headers.conf; limit_except GET HEAD { deny all; } add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { include /etc/nginx/snippets/security-headers.conf; limit_except GET HEAD { deny all; } add_header Cache-Control "no-store" always; try_files $uri $uri/ =404; }
}
