server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /healthz { access_log off; default_type text/plain; add_header Cache-Control "no-store" always; return 204; }
    location = /index.html { limit_except GET HEAD { deny all; } add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location /assets/ { limit_except GET HEAD { deny all; } add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { limit_except GET HEAD { deny all; } add_header Cache-Control "no-store" always; try_files $uri $uri/ =404; }
}
