[package]
name = "wat2wasm_full"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4"

# must use git versions
wasmparser = { version = "0.241.2", fetures = [
    "std",
    "simd",
    "gc",
    "threads",
    "sign-ext",
    "multi-value",
    "reference-types",
    "bulk-memory",
    "extended-const",
    "exceptions",
    "memory64",
    "multi-memory",
    "component-model",
    "tail-call",
    "relaxed-simd",
    "validate",
    "features"
]}
wast = { git = "https://github.com/bytecodealliance/wasm-tools", package = "wast" }
wat = { git = "https://github.com/bytecodealliance/wasm-tools", package = "wat" }