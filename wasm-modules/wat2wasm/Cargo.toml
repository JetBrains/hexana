[package]
name = "wat2wasm_full"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# must use git versions; the revision is pinned to the one recorded in the embedded wat2wasm_full.wasm
wasmparser = { version = "0.241.2", fetures = [
    "std",
    "simd",
    "gc",
    "threads",
    "sign-ext",
    "multi-value",
    "reference-types",
    "bulk-memory",
    "extended-const",
    "exceptions",
    "memory64",
    "multi-memory",
    "component-model",
    "tail-call",
    "relaxed-simd",
    "validate",
    "features"
]}
wast = { git = "https://github.com/bytecodealliance/wasm-tools", package = "wast", rev = "c463da0e0a6310f5c33173164d8b745164bc333a" }
wat = { git = "https://github.com/bytecodealliance/wasm-tools", package = "wat", rev = "c463da0e0a6310f5c33173164d8b745164bc333a" }