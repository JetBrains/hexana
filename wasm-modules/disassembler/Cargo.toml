[package]
name = "disassembler"
version = "0.1.0"
edition = "2024"

[lib]
# "rlib" is required alongside "cdylib" so that `cargo test` can build a native
# test binary; "cdylib" alone produces no rlib metadata and the test harness
# cannot link against it.
crate-type = ["cdylib", "rlib"]

[dependencies]
yaxpeax-arch = { version = "0.3", default-features = false, features = ["std"] }
yaxpeax-x86 = { version = "2.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arm = { version = "0.4", default-features = false, features = ["std", "alloc", "fmt"] }
riscv-decode = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
