[versions]
aircompressor = "2.0.3"
changelog = "2.4.0"
chicory = "1.4.0"
kotlin = "2.2.21"
kotlinLogging = "8.0.01"
kotlinPoet = "2.2.0"
composeMultiplatform = "1.9.0"
graalvm = "25.0.0"
graalvmNativeBuildTools = "0.10.5"
gson = "2.13.1"
intellijDriver = "261.22158.277"
intellijPlatform = "2.10.5"
jib = "3.4.5"
jackson = "2.20.0"
junit4 = "4.13.2"
junit5 = "5.12.2"
clikt = "5.1.0"
kotlinx-browser = "0.5.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
logback = "1.5.32"
posthog-server = "2.4.0"
mcpKotlinSdk = "0.11.0"
ktor = "3.4.1"
slf4j = "2.0.17"
r8 = "9.1.31"

[libraries]
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-compiler = { module = "com.dylibso.chicory:compiler", version.ref = "chicory" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
intellij-driver-client = { module = "com.jetbrains.intellij.driver:driver-client", version.ref = "intellijDriver" }
intellij-driver-model = { module = "com.jetbrains.intellij.driver:driver-model", version.ref = "intellijDriver" }
intellij-driver-sdk = { module = "com.jetbrains.intellij.driver:driver-sdk", version.ref = "intellijDriver" }
intellij-starter-driver = { module = "com.jetbrains.intellij.tools:ide-starter-driver", version.ref = "intellijDriver" }
intellij-starter-junit5 = { module = "com.jetbrains.intellij.tools:ide-starter-junit5", version.ref = "intellijDriver" }
intellij-starter-squashed = { module = "com.jetbrains.intellij.tools:ide-starter-squashed", version.ref = "intellijDriver" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinpoet-jvm = { module = "com.squareup:kotlinpoet-jvm", version.ref = "kotlinPoet" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mcp-kotlin-sdk-jvm = { module = "io.modelcontextprotocol:kotlin-sdk-jvm", version.ref = "mcpKotlinSdk" }
posthog-server = { module = "com.posthog:posthog-server", version.ref = "posthog-server" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
graalvm-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graalvm" }
graalvm-wasm = { module = "org.graalvm.polyglot:wasm", version.ref = "graalvm" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
ktor-server-cio-jvm = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }
ktor-client-cio-jvm = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
ktor-client-websockets-jvm = { module = "io.ktor:ktor-client-websockets-jvm", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }

[bundles]
graalvm = [
    "graalvm-polyglot",
    "graalvm-wasm",
]
intellij-driver = [
    "intellij-starter-squashed",
    "intellij-starter-driver",
    "intellij-driver-client",
    "intellij-driver-sdk",
    "intellij-driver-model",
]

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNativeBuildTools" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
