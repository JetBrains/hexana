name: Leak guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks

      - name: Scan for secrets with the gitleaks default rules
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir . --redact=100 --no-banner --verbose

      - name: Scan for personal home directories and analytics keys
        run: |
          set -euo pipefail
          allowlist=.github/leak-guard-allowlist.txt
          status=0

          report() {
            local rule="$1" pattern="$2" mode="$3" file
            git ls-files -z | xargs -0 grep "$mode" --files-with-matches --extended-regexp -e "$pattern" -- | sort > "${RUNNER_TEMP}/hits.txt" || true
            while IFS= read -r file; do
              if [ -n "$file" ] && ! grep -qxF -- "${rule} ${file}" "$allowlist"; then
                echo "::error file=${file}::${rule}"
                status=1
              fi
            done < "${RUNNER_TEMP}/hits.txt"
          }

          report home-directory '/Users/' -I
          report analytics-key 'phc_' -a
          exit "$status"
